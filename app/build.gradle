plugins { id 'com.android.application' }

android {
    namespace 'com.edwardresearchlabs.now'
    compileSdk 35

    defaultConfig {
        applicationId "com.edwardresearchlabs.now"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
